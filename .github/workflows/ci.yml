name: Continuous Integration

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
              with:
                  install: true
                  cache: true
                  experimental: true
                  minimum_release_age: 7d
            - name: Run checks
              run: mise run check
            - name: Run lint
              run: mise run lint
            - name: Run tests
              run: mise run test
            - name: Run web-ext lint
              run: mise run web-ext-lint
