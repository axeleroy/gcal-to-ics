name: Continuous Integration

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
            - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
              with:
                  install: true
                  cache: true
                  experimental: true
            - name: Run checks
              run: mise run check
            - name: Run lint
              run: mise run lint
            - name: Run tests
              run: mise run test
            - name: Run web-ext lint
              run: mise run web-ext-lint
